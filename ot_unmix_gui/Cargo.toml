[package]
name = "ot_unmix_gui"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ot_unmix_core = { path = "../ot_unmix_core", features = ["gui"] }
eframe = "0.28"
egui = "0.28"
egui_extras = "0.28"
egui_plot = "0.28"
egui_inspect = { git = "https://github.com/dmirauta/egui_inspect", branch = "0_28" }
rfd = "0.14"
# vectoriselp = { path = "../vectorise_lp" }
ndarray = { version = "0.15", features = ["approx", "serde"] }
ndarray-rand = "0.14"
chrono = "0.4"
serde = "1.0"
iter_tools = "0.19"
log = "0.4"
clap = { version = "4.5", features = ["derive"] }
