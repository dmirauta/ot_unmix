[package]
name = "ot_unmix_gui"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ot_unmix_core = { path = "../ot_unmix_core", features = ["gui"] }
egui_inspect = { git = "https://github.com/dmirauta/egui_inspect", branch = "0_29", features = [
  "logging",
] }
egui_extras = "0.29"
egui_plot = "0.29"
rfd = "0.15"

chrono = "0.4"
serde = "1.0"
iter_tools = "0.37"
log = "0.4"
clap = { version = "4.5", features = ["derive"] }
